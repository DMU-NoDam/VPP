# ESS 사양 (MILP 입력)
#
# 담당: C (최적화 코어)
# 단위 규칙: 출력 MW, 에너지 MWh, SOC 는 % 로 받아 로더가 MWh 로 환산한다.
#            time step = 1시간.
#
# ── 규모 근거 ────────────────────────────────────────────────────────────────
# 과제는 ESS 규모를 고정하지 않는다 [미정]. 아래는 두 가지를 맞춘 제안이다.
#
# 1) 실제 설비: data/csv/trading_by_fuel.csv 의 pumped(양수) capacity_mw 가
#    4,700 MW 로 1년 내내 일정하다 (KPX 공급능력). generators.yaml 은 양수를
#    제외하므로(펌핑 중 음수 출력 = ESS 성격) 그 용량을 여기서 받는다.
#    즉 이 ESS 는 "국내 양수발전 설비"를 모델링한 것이고, 출처가 있는 숫자다.
#
# 2) 필요량 검산: 1년치 253개 24h 창에서 피크를 5% 깎는 데 필요한 양을 측정했다
#    (scripts/measure_dispatch_kpi.py 와 같은 창).
#      출력   중앙 3,546 / P90 4,215 / 최대 4,584 MW  -> 4,700 MW 로 전 창 커버
#      에너지 중앙 11,167 / P90 15,868 / 최대 27,171 MWh
#    사용 가능 구간(SOC 10~95% = 용량의 85%)에서 27,171 MWh 를 담으려면 약
#    32,000 MWh 가 필요하다. 그래서 4,700 MW x 7h = 32,900 MWh 로 잡았다.
#    (6h = 28,200 MWh 로 하면 253창 중 4창에서 에너지가 모자랐다.)
#
# [미정] 지속시간 7h 는 위 검산으로 정한 값이고 공식 자료 출처는 없다.
#        국내 양수발전 저수지 용량 자료를 확보하면 교체할 것.

ess:
  # 출력 한계 (충전/방전을 따로 둔다. 양수는 펌프와 터빈 용량이 다를 수 있다)
  power_charge_mw: 4700
  power_discharge_mw: 4700

  # 에너지 용량
  capacity_mwh: 32900

  # ── 효율 ───────────────────────────────────────────────────────────────────
  # 왕복효율(round-trip). 충전·방전에 반씩 나눈다: eta_ch = eta_dis = sqrt(rte).
  # [미정] 양수발전 전형값 0.70~0.80 의 중간인 0.75 를 썼다. 기존 설계 문서의
  #        0.85 는 리튬이온 배터리 기준 예시이고 과제 고정값이 아니다.
  #        양수를 모델링하므로 배터리 값을 쓰면 효율을 과대평가한다.
  round_trip_efficiency: 0.75

  # ── SOC 정책 (% 기준) ──────────────────────────────────────────────────────
  # soc_final_min_pct 가 핵심이다. 종료 SOC 하한이 없으면 MILP 가 하루 동안
  # 배터리를 비우고 끝내 "공짜 에너지"를 얻는다 (비용이 부당하게 낮아진다).
  # 초기와 같은 50% 로 되돌리게 해서 하루 단위 비교가 성립하도록 한다.
  soc_min_pct: 10
  soc_max_pct: 95
  soc_init_pct: 50
  soc_final_min_pct: 50

  # ── 동시 충·방전 금지 ─────────────────────────────────────────────────────
  # false 면 이진변수를 쓰지 않는다. 왕복효율이 1 미만이고 음수 가격이 없으므로
  # 동시 충·방전은 항상 손실이라 비용 최소화 해에서 저절로 배제된다
  # (tests/test_ess.py 가 이를 확인한다). true 로 두면 시간당 이진변수가 1개
  # 늘어나는 대신 모델이 명시적으로 금지한다.
  enforce_exclusive: false

  # ── 운전 목적 ─────────────────────────────────────────────────────────────
  #   cost         비용 최소화만. 피크 감소는 결과로 따라온다 (보장 없음)
  #   peak_shaving 비용 최소화 + "피크를 peak_target_pct 이상 깎는다" 하드 제약
  #   combined     비용 + peak_penalty_krw_per_mw x 피크 를 최소화 (가중합)
  # 기본은 cost 다. baseline(ESS 없음) 과의 비용 비교를 왜곡하지 않기 때문이다.
  # 피크 감소율 5% KPI 는 peak_shaving 모드로 측정한다.
  mode: cost
  peak_target_pct: 5.0
  peak_penalty_krw_per_mw: 0
