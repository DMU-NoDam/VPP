  # p_min_mw 0: 즉시 정지 가능.
  #
  # [미정 — 팀 결정 대기] 수력 총용량이 자료마다 크게 다르다.
  #   (a) 현재 설정           2기 x 525 =  1,050 MW   (실측 최대 896 MW 기반)
  #   (b) 과제 예시표 §5.2                  6,500 MW   (램프율 1,000 MW/h, 기동시간 0.1h)
  # 약 6배 차이다. 수력은 연료비 0 이라 merit order 최상위이므로, 용량이 커지면
  # 항상 full 출력으로 돌고 저수율 30% 제약이 전요단에 미치는 영향도 그만큼 커진다.
  # 즉 이 값은 비용 절감률과 수력 제약의 시연성에 동시에 영향을 준다.
  # 로더와 MILP 는 수력 용량에 무관하게 동작하므로, 팀 확정 후 아래 2기의
  # p_max_mw / ramp 만 교체하거나 블록 수를 늘리면 된다.
  - id: hydro_1
    fuel: hydro
    # fuel_cost 데이터셋에 hydro 가 없다. 수력은 연료비 0 이므로 명시적으로 덮어쓴다.
    fuel_cost_krw_per_mwh: 0
    p_max_mw: 525
    p_min_mw: 0
    ramp_up_mw_per_h: 525
    ramp_down_mw_per_h: 525
    min_up_h: 1
    min_down_h: 1
    startup_cost_krw: 0
    co2_ton_per_mwh: 0.0765
    u_init: 1
    init_state_h: 4

  - id: hydro_2
    fuel: hydro
    # fuel_cost 데이터셋에 hydro 가 없다. 수력은 연료비 0 이므로 명시적으로 덮어쓴다.
    fuel_cost_krw_per_mwh: 0
    p_max_mw: 525
    p_min_mw: 0
    ramp_up_mw_per_h: 525
    ramp_down_mw_per_h: 525
    min_up_h: 1
    min_down_h: 1
    startup_cost_krw: 0
    co2_ton_per_mwh: 0.0765
    u_init: 1
    init_state_h: 4
