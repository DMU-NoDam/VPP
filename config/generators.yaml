# 발전기 제원 (UC + Dispatch MILP 입력)
#
# 담당: C (최적화 코어)
# 단위 규칙: 전력 MW, 에너지 MWh, 램프 MW/h, 배출 tCO2/MWh, 비용 원(KRW).
#            time step = 1시간.
#
# ── 이 파일에 없는 것 ────────────────────────────────────────────────────────
# 1) 연료비. 월별로 변하는 값이라 하드코딩하지 않는다.
#    data_api 의 `fuel_cost` 데이터셋(month, fuel, cost_won_per_kwh)을 로더가
#    `fuel` 코드로 조인하고, 원/kWh → 원/MWh 변환(x1000)을 로더 한 곳에서만 한다.
#    단 fuel_cost 는 열원 5종(nuclear, bituminous_coal, anthracite, oil, lng)만
#    담는다. 수력은 연료비가 없으므로 아래 수력 유닛에 fuel_cost_krw_per_mwh: 0
#    을 명시했다. 로더는 이 필드가 있으면 조인 대신 그 값을 쓴다 (조용한 기본값
#    0 으로 처리하면 단위 버그가 숨는다).
# 2) solar / wind / renewable. 비급전(must-take)이므로 발전기가 아니라 예측
#    시계열로 들어온다. 수급 균형식에서는 순수요 = 수요 - (태양광+풍력+신재생).
# 3) pumped(양수). 펌핑 중 음수 출력이라 성격이 ESS와 같다. config/ess.yaml 에서
#    다루고 여기서는 제외한다. [미정] ESS와 양수의 경계는 팀 결정 필요.
#
# ── fuel 코드값 ──────────────────────────────────────────────────────────────
# services/collector/domain.py 의 FUELS 10종과 반드시 일치해야 한다 (fuel_cost
# 조인 키). CLAUDE.md 필수 규칙상 domain.py 를 import 할 수 없으므로 값으로 맞춘다.
#   hydro oil bituminous_coal nuclear pumped lng anthracite renewable solar wind
# [미정] 이 코드값을 shared/constants.py 로 올릴지 팀 결정 필요.

meta:
  version: 2
  updated: 2026-10-23

  # p_max_mw 산정 근거  [v2 에서 교체]
  # ---------------------------------------------------------------------------
  # v1 은 3일치 실측 최대(73,275 MW)에 가동률 보정계수 1.174 를 곱해 급전가능
  # 설비를 85,570 MW 로 "추정"했다. 그 보정계수는 출처가 없는 내가 만든 값이었다.
  #
  # v2 는 추정을 걷어내고 실측 설비용량을 쓴다. data/csv/trading_by_fuel.csv 에
  # `capacity_mw` 컬럼(KPX 발전원별 공급능력)이 들어 있다. 2025-07-01 ~ 2026-04-10
  # (6,781시간) 동안 급전가능 6종 합계는 116,132 ~ 118,308 MW 로 거의 일정하며,
  # 최신 시각(2026-04-10 23:00) 값을 발전원별 기준으로 썼다.
  #   원자력 26,050 / 유연탄 40,838.6 / 무연탄 400 / LNG 48,378.8 / 유류 531 /
  #   수력 1,609.9  → 합계 117,808.4 MW
  #
  # v1 을 바꾼 이유 (측정 결과)
  #   85,570 MW 로는 1년 중 253개 24h 창 가운데 78개(31%)가 infeasible 이었다.
  #   여름·겨울 피크의 순수요가 최대 91,686 MW 이고, 예비율 10% 요건은 그 1.1배인
  #   약 100,855 MW 를 요구한다. 즉 "모델이 못 푼 게 아니라 설비가 모자랐다".
  #   측정: scripts/measure_dispatch_kpi.py --windows 300
  capacity_basis: observed_capacity_mw_from_trading_by_fuel
  capacity_total_mw: 117808.4
  capacity_source: data/csv/trading_by_fuel.csv capacity_mw (2026-04-10 23:00 기준)
  capacity_window: 2025-07-01 ~ 2026-04-10 (6781h, 합계 116132~118308 MW)

  # p_min_mw 산정 근거
  # ---------------------------------------------------------------------------
  # 기술별 최소출력 비율 가정: 원자력 55%, 유연탄/무연탄/LNG 40%, 유류 20%,
  # 수력 0%. 전 유닛 가동 시 최소출력 합계는 50,280.7 MW 로, 관측된 순수요 최저
  # (약 45,000 MW 대) 보다 크다. 다만 초기 가동 유닛만의 최소출력 합계는
  # 33,030 MW 이고 나머지는 MILP 가 정지시킬 수 있으므로 과잉발전으로 인한
  # infeasible 은 생기지 않는다 (tests/test_milp.py 의 Pmin 테스트 참고).
  # [미정] 기술별 비율의 공식 출처는 없다. EPSIS 또는 논문값으로 교체 대상.
  p_min_basis: assumption_technology_ratio_only

  # 블록 수
  # ---------------------------------------------------------------------------
  # 총 29기 (원자력 4 / 유연탄 8 / 무연탄 1 / LNG 12 / 유류 2 / 수력 2).
  # CLAUDE.local.md 권장 범위(대표유닛 20~40기) 안이다. 발전원별 설비용량을
  # 블록 수로 균등 분할했다.
  # [미정] "발전기 블록 수"는 CLAUDE.md 미정 목록 항목이다. 아래는 제안이며,
  #        팀 확정 시 블록 수만 조정하면 된다 (로더·MILP는 유닛 수 무관).
  # 한계: fuel_cost 는 발전원별 단가 1개만 주므로 같은 발전원의 블록들은 연료비가
  #       같다. 블록별 열효율 자료를 확보하면 계단형 merit order 로 쪼갤 수 있다.
  unit_count: 29

  # 배출계수 출처
  # ---------------------------------------------------------------------------
  # IAEA "Climate Change and Nuclear Power 2022", 전과정(life cycle) 기준,
  # 원자료 UNECE 2022. 원 단위는 gCO2eq/kWh 이고 tCO2/MWh 로 바꿀 때 x0.001.
  # docs/data_sources.md 에 정리된 범위의 중간값을 대표값으로 썼다.
  #   원자력 5.1~6.4 / 석탄 751~1095 / 천연가스(복합) 403~513 / 수력 6.0~147
  # [미정] 범위의 중간값을 쓴 것은 내 선택이다. 그리고 유류 0.70 · 무연탄 0.95 는
  #        IAEA 표에 해당 항목이 없어 출처가 전혀 없는 내가 만든 숫자다.
  # 정식 대안: IPCC 2006 가이드라인의 연료별 기본배출계수(tCO2/TJ)에 발전효율을
  #            적용해 tCO2/MWh 로 환산하면 출처 있는 값이 된다. 국내 고유계수는
  #            온실가스종합정보센터 국가 인벤토리 자료를 확인할 것.
  emission_source: IAEA CCNP 2022 (life cycle, gCO2eq/kWh x0.001)

  # 램프율
  # ---------------------------------------------------------------------------
  # [미정] 출처 없음. 기술별 유연성 순서(LNG > 석탄 > 원자력)만 반영한 가정이다.
  # p_max 대비 비율로 잡았다: nuclear 10%/h, coal 60%/h, lng 100%/h,
  # hydro 100%/h, oil 100%/h, anthracite 60%/h.
  # 1시간 time step 에서는 램프 제약이 거의 binding 되지 않으므로, 이 값이 틀려도
  # 해가 크게 바뀌지 않는다. 다만 위기 시나리오(solar ramp-down)에서는 영향이 있다.
  ramp_basis: assumption_technology_flexibility_order_only

  # 최소 가동/정지 시간
  # ---------------------------------------------------------------------------
  # [미정] 출처 없음. CLAUDE.md 미정 목록의 "일부 min up/down 값" 항목이다.
  # coal 6h / lng 2h 는 v0 generators.yaml 값을 이어받았는데, 그 v0 자체가
  # "미션 문서 예시값"이고 CLAUDE.md 정보 우선순위에서 과제 문서의 결과 예시는
  # 정답이나 타깃 값이 아니다(5순위). nuclear 24h, oil 1h, hydro 1h 와 모든
  # min_down_h 는 출처 없는 내 가정이다 (v0 에는 min_down_h 가 아예 없었다).
  min_up_down_basis: assumption_v0_carryover_and_guess

  # 기동비
  # ---------------------------------------------------------------------------
  # [미정] 출처 없음. CLAUDE.md 미정 목록의 "startup cost" 항목이다.
  # 아래 값은 기술별 상대 크기(원자력 >> 석탄 > LNG > 유류 > 수력)만 반영한
  # placeholder 다. 목적함수 = 연료비 + 기동비 이므로 절감률 KPI에 직접 영향을
  # 주니, 팀 확정 전까지는 민감도 분석 대상으로 둔다.
  # 대안: startup_fuel_mwh_per_mw 를 두고 fuel_cost 와 곱해 산출하면 월별 연료비
  #       변동이 기동비에도 반영된다. 파라미터가 하나 더 늘어 일단 보류.
  startup_cost_basis: placeholder_relative_magnitude_only

  # 초기 상태
  # ---------------------------------------------------------------------------
  # [미정] CLAUDE.md 미정 목록의 "초기 commitment 상태"다. 기저부하 가동 /
  #        첨두 일부 가동이라는 합리적 기본안이다 (원자력 4기·유연탄 6/8기·
  #        LNG 4/12기·수력 2기 가동). 정지 유닛의 init_state_h 는 min_down_h 와
  #        같게 두어 t=0 에 기동이 가능하도록 했다.
  # 유닛별 초기 출력(p_init)은 이 파일에 없다. 수집 데이터에 발전원별 합계만
  # 있어서다. 요청에 p_init_mw 가 없으면 MILP·baseline 모두 t=0 램프 제약을
  # 생략한다 (docs/formulation.md 4.2-4).
  initial_state_basis: assumption_baseload_on_peaker_partial

