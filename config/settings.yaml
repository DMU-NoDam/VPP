# 운영 파라미터
# [미정] horizon_h / reserve_margin 산식은 팀 확정 전 placeholder.

horizon_h: 24
time_step_min: 60
timezone: Asia/Seoul

# MILP solver.
# [현재 방향] HiGHS 우선. PuLP 번들 CBC 바이너리는 osx/i64(x86_64) 전용이라
# Apple Silicon 로컬에서는 "Bad CPU type"으로 실행되지 않는다 (Docker/linux에서는 동작).
# 선택지: HiGHS | PULP_CBC_CMD
solver: HiGHS
solver_msg: false
# [권장] 10초 KPI 대비 안전장치. 0 또는 null이면 미적용.
solver_time_limit_s: 60
solver_mip_gap: 0.0

# 예비율. [미정] 산식은 팀 확정 필요 (CLAUDE.md 결정 로그 참조).
reserve_margin_ratio: 0.10

# ── 로더 ────────────────────────────────────────────────────────────────────
# 5분 원본 -> 1시간 집계 규칙. mean | instant
# [확정 2026-10-01] mean (시간평균). 1시간 에너지 균형과 의미가 맞다.
#   주의: B 의 수요 예측도 같은 규칙이어야 비교·통합이 성립한다.
resample: mean

# 그 시간을 받아들일 최소 샘플 비율 (0.0 = 필터 끔).
# 5분 간격이면 1시간에 12개가 와야 하고, 0.9 는 11개 이상을 요구한다.
#
# [확정 2026-10-11] 0.9. KPX sukub.do 원본을 직접 조회해 확인한 결과, 빠진 시각은
# "값이 빈 칸"이 아니라 "행 자체가 없음"이다 (조회한 3일 모두 빈 칸 0개).
#   - 단발 누락 (주로 23:55, 전체 결측 607칸의 26%) -> 그 시간은 11/12 샘플.
#     11개 평균과 12개 평균은 사실상 같으므로 버릴 이유가 없다. 1.0 으로 두면
#     2025-07~12 구간에서 278시간(6.3%)이 버려지고 격자에 구멍이 생겼다.
#   - 연속 누락 (예 2026-06-29 23:20~23:55) -> 비율로 걸러진다. 수십 분이 비면
#     그 시간 평균은 신뢰할 수 없다.
# 완화해도 남는 격자 구멍은 latest_contiguous_window 가 처리한다.
min_sample_ratio: 0.9

# 순수요 계산식. subtract_solar_renewable | subtract_renewable_only | demand_only
# [미정] power_demand(= fuelPwrTot)가 태양광(fuelPwr9)을 포함하지 않는 것으로
#        측정됐다 (태양광 제외 합산 시 잔차가 상수 7,240 MW, corr -0.069).
#        포함 관계가 확정되면 기본값을 재검토한다.
net_demand_mode: subtract_solar_renewable

# 연료비를 가져올 월. latest | YYYY-MM
# 지정한 월이 데이터에 없으면 최신 월로 대체하고 경고를 남긴다.
fuel_cost_month: latest

# ── 수력 저수율 제한 ─────────────────────────────────────────────────────────
# 과제 [필수]: 저수율 < 30% 이면 수력 출력을 제한한다.
# [미정] "얼마나" 제한할지는 과제에 없다. 아래는 제안이며 근거를 남긴다.
#   derate_mode: linear | fixed
#     linear — factor = min_factor + (1-min_factor) x rate / threshold_pct
#              threshold 에서 1.0, 저수율 0% 에서 min_factor 로 선형 감소.
#              30.0% 와 29.9% 사이에서 급전 계획이 계단처럼 바뀌지 않게 하려는 것이다.
#     fixed  — 임계값 미만이면 일괄 min_factor
#   min_factor 0.5: 저수율이 바닥일 때 설비의 절반까지만 쓴다는 가정이다.
#                   수력 2기 1,050 MW 규모에서는 전체 급전에 거의 영향이 없고,
#                   수력 용량이 과제 예시표(6,500 MW)로 커지면 영향이 커진다.
# 현재 수집된 저수율(소양강)은 54~65% 대라 평시에는 제한이 걸리지 않는다.
# 제한 동작은 tests/test_milp.py 의 저수율 트리거 테스트로 확인한다.
hydro:
  threshold_pct: 30.0
  min_factor: 0.5
  derate_mode: linear

# ── 부하차단 슬랙 ────────────────────────────────────────────────────────────
# [모델링 선택] 과제 필수 제약이 아니다. 기본은 비활성이며, 요청에서 켜면
# 부족량이 숫자로 나온다 (위기 시나리오 진단용). 10,000,000 원/MWh = 10,000 원/kWh
# 로 가장 비싼 연료비(유류 279 원/kWh)의 수십 배라, 돌릴 수 있는 발전기가 있으면
# 반드시 돌린다.
shed_penalty_krw_per_mwh: 10000000
