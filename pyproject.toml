[project]
name = "vpp-dispatch"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pandas>=2.2",
  "pydantic>=2.6", "requests>=2.31", "streamlit>=1.35",
  "plotly>=5.20", "numpy>=1.26",
  # Two-Stage Stochastic (선택 A): 과제 제약상 Pyomo 사용, 솔버는 아래 HiGHS 공용
  "pyomo>=6.8",
  # PuLP 4.0은 Rust 코어로 전면 재작성되어 LpVariable.dicts 등 기존 API가 제거됨.
  # UC 모델의 u[g,t] 인덱싱 관용구를 유지하기 위해 3.x 계열로 핀한다.
  "pulp>=2.8,<4",
  # config 로딩 (config/*.yaml)
  "pyyaml>=6.0",
  # MILP solver: PuLP 기본 CBC 외에 HiGHS 사용 (C 담당 성능 KPI 10초)
  "highspy>=1.7",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.isort]
# collector 는 패키지 없이 평평한 모듈로 돌아간다 (main.py 가 같은 폴더에서 import).
# dispatch_api 도 같은 관례를 따른다 (constants, models, loaders).
known-first-party = [
  "shared",
  # collector
  "collector", "data_api", "domain", "sources", "store",
  # dispatch_api
  "main", "constants", "models", "loaders",
  "milp", "baseline", "schedule", "validation", "carbon", "scenarios", "service",
  "units", "stochastic", "precompute",
  # dashboard
  "logic", "ui", "page_scenarios", "page_stochastic_test",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=services --cov-report=term-missing"
# PuLP 3.x 가 4.0 API 변경을 미리 경고한다. 의존성을 <4 로 핀해 둔 상태이므로
# (pyproject dependencies 주석 참고) 테스트 출력에서만 숨긴다. 핀을 올릴 때
# 이 필터를 먼저 지우고 경고를 다시 확인할 것.
filterwarnings = [
  "ignore:Constructing LpVariable:DeprecationWarning",
  "ignore:Using LpProblem.constraints as a dict mapping:DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared"]
